<body><button onclick="calculateSum()">Click me</button>

<script>
    function calculateSum() {
        let numbers = [];

        for (let i = 0; i <= 100; i++) {
            numbers.push(i);
        }

        let sum = 0;

        for (let i = 0; i < numbers.length; i++) {
            sum = sum + numbers[i];
        }

        console.log(sum);
    }
</script>
